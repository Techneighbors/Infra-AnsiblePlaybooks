[defaults]
# Basic configuration
inventory = inventory/,scripts/dynamic_inventory.py
host_key_checking = False
timeout = 30
gathering = smart
fact_caching = memory
fact_caching_timeout = 3600

# Output formatting
# The yaml callback was removed from community.general 12; use ansible-core's
# built-in default callback with YAML result formatting instead.
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = timer, profile_tasks

# Performance
forks = 10
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Logging (commented out for Semaphore compatibility)
# log_path = /var/log/ansible.log

# Security (commented out - no vault needed for basic inventory discovery)
# vault_password_file = .vault_pass

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s
control_path_dir = /tmp
pipelining = True
retries = 3 